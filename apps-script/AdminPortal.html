<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>行政系統</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        color: #333;
        font-family: sans-serif;
      }

      main {
        max-width: 520px;
        margin: 48px auto;
      }

      h1 {
        color: #8B0000;
      }

      form {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      input,
      button,
      .system-link {
        box-sizing: border-box;
        min-height: 44px;
        padding: 10px 14px;
        border-radius: 6px;
        font: inherit;
      }

      input {
        flex: 1 1 220px;
        border: 1px solid #999;
      }

      button,
      .system-link {
        border: 0;
        background: #8B0000;
        color: #fff;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      #status {
        min-height: 1.5em;
        color: #8B0000;
      }

      #systems {
        display: grid;
        gap: 12px;
      }

      .system-link {
        display: block;
        text-decoration: none;
      }

      .system-link:hover,
      .system-link:focus-visible,
      button:hover,
      button:focus-visible {
        background: #600000;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="login">
        <h1>行政系統</h1>
        <p>請輸入管理密碼以查看系統連結。</p>
        <form id="login-form">
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            aria-label="管理密碼"
            required
          >
          <button id="submit" type="submit">登入</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </section>

      <section id="systems" hidden>
        <h1>行政系統</h1>
        <a class="system-link" href="https://ltginventory.streamlit.app/" target="_blank" rel="noopener noreferrer">庫存管理系統</a>
        <a class="system-link" href="https://ltgnoapp.streamlit.app" target="_blank" rel="noopener noreferrer">法會及進香報名人數系統</a>
        <a class="system-link" href="https://ltgblqrrt.streamlit.app/" target="_blank" rel="noopener noreferrer">收據及信徒資料系統</a>
      </section>
    </main>

    <script>
      const form = document.getElementById('login-form');
      const passwordInput = document.getElementById('password');
      const submitButton = document.getElementById('submit');
      const status = document.getElementById('status');

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        status.textContent = '驗證中…';

        google.script.run
          .withSuccessHandler((isValid) => {
            passwordInput.value = '';
            submitButton.disabled = false;

            if (isValid) {
              document.getElementById('login').hidden = true;
              document.getElementById('systems').hidden = false;
              return;
            }

            status.textContent = '密碼錯誤，請重新輸入。';
            passwordInput.focus();
          })
          .withFailureHandler((error) => {
            passwordInput.value = '';
            submitButton.disabled = false;
            status.textContent = error && error.message
              ? error.message
              : '驗證時發生錯誤，請稍後再試。';
          })
          .verifyAdminPassword(passwordInput.value);
      });
    </script>
  </body>
</html>
